name: jagspoor
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
    
  # Live camera scanning of high-density PDF417 barcodes (SA documents)
  mobile_scanner: ^6.0.11
  
  # Reliable native camera access to bypass GPU/Vulkan rendering errors
  image_picker: ^1.0.0
  flutter_image_compress: ^2.3.0
  
  # Camera access for spoor identifier
  camera: ^0.10.5+5

  # TensorFlow Lite for on-device AI image classification
  tflite_flutter: ^0.11.0
  
  # Image processing for model input preparation
  image: ^4.1.3

  # Core localization, formatting, and South African document parsing
  intl: ^0.20.2

  # PDF generation and sharing
  pdf: ^3.11.0
  printing: ^5.14.3

  # SVG rendering (official Google "G" sign-in logo asset)
  flutter_svg: ^2.0.10+1

  # GPS and location services
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  http: ^1.6.0

  # Modern UI indicators
  cupertino_icons: ^1.0.6
  
  # FIREBASE - All aligned to ^7.1.0 platform_interface
  firebase_core: ^4.5.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3  # <-- CHANGED from 12.3.1
  firebase_crashlytics: ^5.2.4
  firebase_analytics: ^12.1.0
  google_sign_in: ^6.2.1

  # Offline-capable animal profile images (SA Game Guide)
  cached_network_image: ^3.4.1

  # Camera permissions handler
  permission_handler: ^11.3.0

  # CSV parsing for animal data seeding
  csv: ^6.0.0

  # Local storage for offline cache flags
  shared_preferences: ^2.2.2
  
  # SQLite database for local data persistence
  sqflite: ^2.4.1

  # URL launcher for communication shortcuts
  url_launcher: ^6.3.0

  # Hardware compass for tactical navigation
  flutter_compass: ^0.8.1

  # Accelerometer and gyroscope sensors for gyro leveler (v20.2)
  sensors_plus: ^6.1.1

  # Interactive ballistic trajectory charting
  fl_chart: ^0.68.0
  path: ^1.9.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  flutter_reactive_ble: ^5.4.1
  nearby_connections: ^4.3.0

  # Tile caching for offline map support
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0
  connectivity_plus: ^7.3.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^18.0.0
  signature: ^6.4.0
  file_picker: ^8.0.0
  flutter_blue_plus: ^2.3.11
  firebase_app_check: ^0.4.6

  # Native calendar event creation for confirmed bookings
  add_2_calendar: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  # Native splash screen generator (Android + iOS launch screens)
  flutter_native_splash: ^2.4.6
  # Test mocking libraries
  test: ^1.25.0
  mockito: ^5.4.4
  # Pinned to ^4.2.0. The 4.1.1 mock's `MockWriteBatch.update` declared a
  # non-generic signature (`void update(DocumentReference, Map<Object,Object?>)`)
  # that does not satisfy `cloud_firestore` 6.8.0's generic
  # `void update<T>(DocumentReference<T>, T)` — a compile-time override
  # mismatch that broke `bug_report_screenshot_test.dart` and
  # `offline_sync_queue_test.dart`. 4.2.0 fixed the mock signature to be
  # generic and aligns with `cloud_firestore` ^6.7.1 (resolved 6.8.0).
  fake_cloud_firestore: ^4.2.0
  # Pinned to the 2.3.x line. sqflite_common_ffi >=2.4.0 requires Dart SDK
  # ^3.12.0, which is incompatible with the CI Flutter 3.29.1 pin (Dart 3.7).
  # 2.3.6 requires Dart ^3.7.0 — satisfies both CI 3.29.1 and local 3.47.0.
  sqflite_common_ffi: '>=2.3.6 <2.4.0'

dependency_overrides:
  # `fake_cloud_firestore` 4.2.0 declares `rx ^0.5.0`, but `rx 0.5.0` requires
  # Dart ^3.8.0 — incompatible with the CI Flutter 3.29.1 pin (Dart 3.7.0).
  # The `rx` package is NOT imported anywhere in `fake_cloud_firestore`'s lib
  # source (only `rxdart` is imported, which is a separate Dart-3.7-compatible
  # package), so pinning `rx` to 0.4.0 (Dart ^3.2.0) is safe: it satisfies the
  # resolver without affecting runtime behavior, and lets the 4.2.0 mock's
  # generic `MockWriteBatch.update<T>` resolve on Dart 3.7 (fixing the compile
  # skew against `cloud_firestore` 6.8.0).
  rx: ^0.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/app logo/
    - assets/models/spoor_classifier.tflite
    - assets/models/labels.txt
    - assets/data/ammunition_database.csv
    - assets/data/bullet_database.csv
    - assets/data/propellant_database.csv

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app logo/logo1.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/app logo/logo1.png"