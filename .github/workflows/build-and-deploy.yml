name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for Firebase App Distribution'
        required: false
        default: 'New build available!'

# Minimal permissions — the build only needs to read the repo; the deploy
# job uploads to Firebase via its own service-account secret.
permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17 (AGP 8.x requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    name: Build iOS (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Run pod install against the iOS simulator so the Podfile.lock is
      # resolved before the Xcode build. --no-codesign skips signing because
      # the GitHub-hosted runner has no provisioning profile / signing cert.
      - name: Build iOS for simulator (no codesign)
        run: flutter build ios --simulator --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphonesimulator/

  deploy-firebase:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    needs: build-android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Firebase secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set — skipping Firebase App Distribution deploy."
            echo "::warning::Configure the repo secret FIREBASE_SERVICE_ACCOUNT (and optional TESTER_EMAILS) to enable deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        if: steps.secrets.outputs.deploy == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        if: steps.secrets.outputs.deploy == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'

      - name: Install dependencies
        if: steps.secrets.outputs.deploy == 'true'
        run: flutter pub get

      - name: Build debug APK
        if: steps.secrets.outputs.deploy == 'true'
        run: flutter build apk --debug

      - name: Get latest commit info
        if: steps.secrets.outputs.deploy == 'true'
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_OUTPUT

      - name: Download APK
        if: steps.secrets.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/

      - name: Upload to Firebase App Distribution (Android)
        if: steps.secrets.outputs.deploy == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-debug.apk
          release-notes: |
            ${{ github.event.inputs.release_notes || steps.commit.outputs.message }}
            Commit: ${{ steps.commit.outputs.sha }}
            Branch: main
          notifications: true
          testers: ${{ secrets.TESTER_EMAILS }}

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: deploy-firebase
    if: always()
    steps:
      - name: Send Discord Notification
        if: vars.DISCORD_WEBHOOK != ''
        uses: aristidp/discord-action@v1
        with:
          webhook: ${{ vars.DISCORD_WEBHOOK }}
          message: |
            ✅ **Jagspoor Build Deployed!**
            📱 New APK available on Firebase App Distribution
            👥 Testers have been emailed
            🔗 Check Firebase Console for details
        # Note: if deploy-firebase skipped (FIREBASE_SERVICE_ACCOUNT unset),
        # this still reports a successful build. Adjust the message above to
        # reflect deploy status if you want quieter "build-only" pings.
